[project]
name = "automation-module-vmray"
version = "1.1.0"
description = "VMRay Platform sandbox integration for Sekoia"
authors = []
requires-python = ">=3.11,<4"
dependencies = [
	"sekoia-automation-sdk>=1.26.0,<2",
	"tenacity",
]

[dependency-groups]
dev = [
	"pytest>=9.0.3,<10",
	"pytest-cov>=7.0.0,<8",
	"requests-mock",
]
lint = [
	"ruff>=0.14",
	"mypy",
]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["A", "ARG", "E", "F", "I", "N", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
install_types = true
non_interactive = true
ignore_missing_imports = true
show_column_numbers = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
	--cache-clear
	--cov=vmray_modules
	--cov-report=term-missing:skip-covered
	-ra
	-m "not slow"
"""
testpaths = ["tests"]
pythonpath = ["."]
markers = [
	"slow: exercises real urllib3 retry/backoff over a real local socket (real sleeps, ~30s) - excluded from the default run, include explicitly with -m slow or -m '' for CI/homologation",
]

[tool.coverage.run]
omit = ["tests/*", "main.py"]
